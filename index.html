<!doctype html>
<html lang="en" data-theme="dark" data-page="home">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="David Barragán is a full-stack developer in Ambato, Ecuador, focused on microservices, clean architecture, and reliable backend software. Explore his work and portfolio." />
    <link rel="stylesheet" href="/src/styles/contact-transition.css" />
    <link rel="preload" href="/assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/apparel-font-family/Fontspring-DEMO-apparel-regularit.otf" as="font" type="font/otf" crossorigin />
    <style>
      :root { --intro-paper: #080a0d; }
      @media (prefers-reduced-motion: no-preference) {
        @view-transition { navigation: auto; }
        html:has(#root:empty) { background-color: var(--intro-paper); }
      }
    </style>
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual"
      if (location.hash && performance.getEntriesByType("navigation")[0]?.type === "reload") {
        history.replaceState(history.state, "", location.pathname + location.search)
      }
    </script>
    <title>David Barragán | Software Engineer</title>

    <script type="module" src="/src/main.tsx"></script>
