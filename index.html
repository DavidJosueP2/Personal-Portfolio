<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/apparel-font-family/Fontspring-DEMO-apparel-regularit.otf" as="font" type="font/otf" crossorigin />
    <style>
      :root { --intro-paper: #080a0d; }
      @media (prefers-reduced-motion: no-preference) {
        html:has(#root:empty) { background-color: var(--intro-paper); }
      }
    </style>
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual"
      if (location.hash) history.replaceState(history.state, "", location.pathname + location.search)

      try {
        if (localStorage.getItem("portfolio:theme") === "light") document.documentElement.dataset.theme = "light"
      } catch {}
    </script>
    <title>David Barragán | Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
